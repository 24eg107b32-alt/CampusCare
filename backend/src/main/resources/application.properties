spring.application.name=campuscare-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campuscare;MODE=MySQL;DB_CLOSE_DELAY=-1;FILE_LOCK=NO}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
